name : AI Cloud Log Analyzer CI

on:
  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        pip install -r requirements/requirements.txt

    - name: Run tests 
      run: |
        python test_dynamodb.py
